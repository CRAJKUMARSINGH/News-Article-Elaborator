kind = "web"
previewPath = "/"
title = "Jan Samvad Data — News Elaborator"
description = "A polished editorial workspace for turning investigative source material into a clear long-form report and a presentation-ready story outline, with a focus on evidence, readability, and logical progression."
version = "1.0.0"
id = "artifacts/ifms-news-article"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22131

[services.development]
run = "pnpm --filter @workspace/ifms-news-article run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/ifms-news-article", "run", "build" ]
serve = "static"
publicDir = "artifacts/ifms-news-article/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22131"
BASE_PATH = "/"
